# /etc/dictate.conf - system-wide defaults for dictate(1).
# Per user: ~/.config/dictate.conf (same syntax, read after this file).
# Both are sourced by bash, so plain VAR=value assignments.

# whisper ggml model. Empty: large-v3-turbo if installed, else large-v3,
# from /usr/share/whisper-cpp/models.
#DICTATE_MODEL=

# Spoken language: auto, de, en, ...
#DICTATE_LANG=auto

# Vocabulary hint for whisper: names and terms it should spell correctly.
#DICTATE_PROMPT="DRBD, LINSTOR, Pacemaker, Kubernetes."

# How the text gets into the window: type (dotool, default) or
# paste (wl-copy + Ctrl+V; does not work in Konsole), or print (stdout, for
# testing).
#DICTATE_OUTPUT=type

# CPU threads for whisper (default: half the cores).
#DICTATE_THREADS=8

# whisper-server of dictate-server.service. Empty: always use whisper-cli
# (loads the model for every dictation: several seconds slower).
#DICTATE_SERVER=http://127.0.0.1:8178
# Seconds to wait for the server to finish loading the model.
#DICTATE_SERVER_WAIT=30

# Encoder window: auto (2.5x the recording length, rounded up to a multiple
# of 256: much faster for short dictations), 0 (full 30 s window), or a
# number (50 per second, max 1500; must be a multiple of 256 with Vulkan).
#DICTATE_AUDIO_CTX=auto

# Keyboard layout for dotool. Empty: KDE's first layout, else localectl's.
#DOTOOL_XKB_LAYOUT=de
#DOTOOL_XKB_VARIANT=nodeadkeys

# Safety: dotool's keys are real key presses for KWin. While typing, global
# shortcuts are blocked (a still-held Meta would turn the text into Meta+X
# shortcuts) and modifiers are released.

# Type only if a normal window has the focus, it is the window that was
# focused when the recording stopped, and the screen is not locked.
# Otherwise the text goes to the clipboard. 0 disables the check.
#DICTATE_CHECK_FOCUS=1
# Window classes (kdotool getwindowclassname) never typed into, extended
# regex matched against the whole class.
#DICTATE_DENY_CLASSES='plasmashell|org\.kde\.plasmashell|kscreenlocker_greet|krunner|org\.kde\.krunner'

# Whisper hallucinates on silence and noise. Such transcripts are dropped:
# - text matching this extended regex (case-insensitive; empty: no check)
#DICTATE_REJECT='спасибо|продолжение следует|untertitel (von|im auftrag|der amara)|amara\.org|fürs zuschauen|thanks? (you )?for watching'
# - characters outside these Unicode scripts (besides digits, punctuation
#   and symbols); space-separated PCRE script names, empty: no check
#DICTATE_SCRIPTS='Latin'
# - the same word this many times in a row (0: no check)
#DICTATE_MAX_REPEAT=4

# Meta+Space presses within this many seconds after a dictation finished
# are ignored; presses while one is still transcribing or typing as well.
#DICTATE_DEBOUNCE=1
